name: Collect jobs

on:
  schedule:
    - cron: "7 */2 * * *"      # every 2 hours (UTC). GitHub may start it a few minutes late.
  workflow_dispatch: {}          # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Self-test (offline fixtures)
        run: python -m unittest discover -s collector/tests -t .

      - name: Collect, classify, dedupe
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m collector.run

      - name: Save results (Vercel redeploys on this commit)
        run: |
          git config user.name  "job-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.db public/dataenginer/data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
